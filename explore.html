<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Our Initiatives — Meridian Trust</title>
    <link rel="icon" type="image/svg+xml" href="svg.svg">

    <!-- GSAP & Lenis Libraries for Premium Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html.lenis { height: auto; }
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
        .lenis.lenis-stopped { overflow: hidden; }

        body {
            background: #080808;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            top: 0;
            left: 0;
            width: 100%;
            height: 86px;
            display: flex;
            align-items: center;
            padding: 0 10%;
            background: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo-placeholder {
            display: flex;
            align-items: center;
            gap: 11px;
            flex-shrink: 0;
        }

        .nav-links {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 37px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.88);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #ffca05;
        }

        .donate {
            margin-left: 52px;
            width: 113px;
            height: 42px;
            border-radius: 25px;
            background: #ffca05;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2.2px;
            transition: transform .2s ease;
        }

        .donate:hover { transform: translateY(-2px); }

        /* ===== PAGE HERO ===== */
        .page-hero {
            padding: 200px 10% 100px 10%;
            text-align: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            margin-bottom: 39px;
            color: #d8d8d8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .eyebrow .dot {
            width: 6px;
            height: 6px;
            background: #ffca05;
            border-radius: 50%;
        }

        h1 {
            font-size: clamp(48px, 6vw, 84px);
            line-height: 1.05;
            letter-spacing: -2px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .yellow {
            color: #ffca05;
        }

        .hero-desc {
            max-width: 600px;
            margin: 0 auto;
            font-size: 20px;
            line-height: 1.6;
            color: #aaa;
        }

        /* ===== INITIATIVES GRID ===== */
        .explore-grid {
            padding: 50px 10% 150px 10%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 60px;
        }

        .explore-card {
            background: #111;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .explore-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 202, 5, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* MANUAL SLIDER CSS */
        .slider-container {
            width: 100%;
            height: 350px;
            position: relative;
            overflow: hidden;
        }

        .slider-images {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slider-images img {
            width: 100%;
            flex-shrink: 0;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85);
            transition: filter 0.4s ease;
        }
        
        .explore-card:hover .slider-images img {
            filter: brightness(1);
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .slider-container:hover .slider-btn {
            opacity: 1;
        }

        .slider-btn:hover {
            background: #ffca05;
            color: #000;
        }

        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        .card-content {
            padding: 40px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-meta {
            color: #ffca05;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .card-desc {
            color: #888;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* POSTER DETAILS CSS */
        .poster-details {
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #ffca05;
            margin-top: auto;
        }

        .detail-item {
            font-size: 13px;
            color: #ddd;
            line-height: 1.4;
        }

        .detail-item strong {
            display: block;
            color: #ffca05;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            transition: gap 0.3s ease;
            margin-top: auto;
        }

        .read-more:hover {
            gap: 20px;
            color: #ffca05;
        }

        .arrow {
            width: 30px;
            height: 30px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .explore-card:hover .arrow {
            background: #ffca05;
            color: #000;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .explore-grid { grid-template-columns: 1fr; gap: 60px; }
            .card-img-wrapper, .slider-container { height: 400px; }
        }

        @media (max-width: 900px) {
            .navbar { padding: 0 5%; }
            .nav-links { display: none; }
        }

        @media (max-width: 480px) {
            .page-hero { padding: 150px 5% 50px 5%; }
            h1 { font-size: 36px; }
            .slider-container { height: 250px; }
            .card-content { padding: 30px 20px; }
            .card-title { font-size: 24px; }
            .poster-details { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo-placeholder">
            <a href="index.html">
                <img src="svg.svg" alt="Meridian Foundation Trust" style="height: 48px; width: auto;" />
            </a>
        </div>
        <nav class="nav-links">
            <a href="index.html">HOME</a>
            <a href="index.html#about">ABOUT</a>
            <a href="index.html#our-work">OUR WORK</a>
            <a href="explore.html" style="color: #ffca05;">IMPACT</a>
        </nav>
        <a class="donate" href="index.html#donate">DONATE</a>
    </header>

    <section class="page-hero">
        <div class="eyebrow gsap-fade-up">
            <span class="dot"></span> EXPLORE OUR WORK
        </div>
        <h1 class="gsap-text-reveal">Deepen your <span class="yellow">understanding</span><br>of our initiatives.</h1>
        <p class="hero-desc gsap-fade-up">
            Discover the detailed breakdown of our programs, from education and skilling to community development.
        </p>
    </section>

    <section class="explore-grid">
        <!-- Dynamic Content Injected Here -->
    </section>

    <script>
        // Smooth Scrolling (Lenis)
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true,
        });
        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        
        // DYNAMIC POSTERS RENDER LOGIC
        
        // DYNAMIC POSTERS RENDER LOGIC FROM MONGODB
        const grid = document.querySelector('.explore-grid');
        
        async function loadExplorePosters() {
            try {
                const response = await fetch('/api/posters');
                if (response.ok) {
                    const posters = await response.json();
                    renderPosters(posters);
                } else {
                    console.error("Failed to load posters from DB");
                }
            } catch (err) {
                console.error("Error loading posters:", err);
            }
        }

        function renderPosters(posters) {
            grid.innerHTML = '';
            if (posters.length === 0) {
                grid.innerHTML = '<p style="color:var(--text);text-align:center;width:100%;grid-column:1/-1;">No posters available.</p>';
                return;
            }

            posters.forEach(p => {
                const images = p.images && p.images.length ? p.images : ['indian_children_education_1790095446949.jpg'];
                const imgHTML = images.map((img, i) => `<img src="${img}" alt="Slide ${i}">`).join('');
                
                const cardHTML = `
                    <div class="explore-card gsap-fade-up-scroll">
                        <div class="slider-container">
                            <div class="slider-images">
                                ${imgHTML}
                            </div>
                            <button class="slider-btn prev-btn">&#10094;</button>
                            <button class="slider-btn next-btn">&#10095;</button>
                        </div>
                        <div class="card-content">
                            <div class="card-meta">${p.meta}</div>
                            <h3 class="card-title">${p.title}</h3>
                            <p class="card-desc">${p.desc}</p>
                            
                            <div class="poster-details">
                                <div class="detail-item"><strong>Date</strong>${p.date}</div>
                                <div class="detail-item"><strong>Time</strong>${p.time}</div>
                                <div class="detail-item"><strong>Location</strong>${p.loc}</div>
                                <div class="detail-item"><strong>Status</strong>Active</div>
                            </div>

                            <a href="#" class="read-more">READ FULL STORY <div class="arrow">&rarr;</div></a>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });

            // Re-initialize slider logic for new dynamically loaded cards
            initSliders();
            
            // Re-trigger ScrollTrigger to recognize new DOM elements
            setTimeout(() => {
                ScrollTrigger.refresh();
            }, 100);
        }

        loadExplorePosters();



        // GSAP Animations
        gsap.registerPlugin(ScrollTrigger);

        gsap.utils.toArray('.gsap-fade-up').forEach(element => {
            gsap.fromTo(element, 
                { opacity: 0, y: 30 },
                { opacity: 1, y: 0, duration: 1, delay: 0.2, ease: "power3.out" }
            );
        });

        gsap.utils.toArray('.gsap-text-reveal').forEach(element => {
            gsap.fromTo(element, 
                { opacity: 0, y: 50 },
                { opacity: 1, y: 0, duration: 1.2, delay: 0.1, ease: "power4.out" }
            );
        });

        gsap.utils.toArray('.gsap-fade-up-scroll').forEach(element => {
            gsap.fromTo(element, 
                { opacity: 0, y: 50 },
                { 
                    opacity: 1, 
                    y: 0, 
                    duration: 1, 
                    ease: "power3.out",
                    scrollTrigger: {
                        trigger: element,
                        start: "top 85%",
                        toggleActions: "play none none reverse"
                    }
                }
            );
        });

        // Manual Slider Logic
        document.querySelectorAll('.slider-container').forEach(container => {
            const track = container.querySelector('.slider-images');
            const images = track.querySelectorAll('img');
            const prevBtn = container.querySelector('.prev-btn');
            const nextBtn = container.querySelector('.next-btn');
            
            let currentIndex = 0;
            const totalImages = images.length;

            function updateSlider() {
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
            }

            nextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                currentIndex = (currentIndex + 1) % totalImages;
                updateSlider();
            });

            prevBtn.addEventListener('click', (e) => {
                e.preventDefault();
                currentIndex = (currentIndex - 1 + totalImages) % totalImages;
                updateSlider();
            });
        });
    </script>
</body>
</html>
