<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Meridian Trust</title>
    <link rel="icon" type="image/svg+xml" href="svg.svg">
    <style>
        body {
            background: #080808;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 40px 10%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 15vw;
            line-height: 1;
            margin: 0;
            letter-spacing: -5px;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        h1::after {
            content: "404";
            position: absolute;
            left: 0;
            top: 0;
            color: #ffca05;
            -webkit-text-stroke: 0px;
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            animation: glitch 3s infinite alternate;
        }

        h2 {
            font-size: 24px;
            margin-top: -20px;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        p {
            color: rgba(255, 255, 255, 0.6);
            max-width: 400px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn {
            background: #ffca05;
            color: #000;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 202, 5, 0.2);
        }

        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,202,5,0.05) 0%, rgba(8,8,8,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        @keyframes glitch {
            0% { clip-path: polygon(0 0, 100% 0, 100% 10%, 0 10%); }
            10% { clip-path: polygon(0 30%, 100% 30%, 100% 40%, 0 40%); }
            20% { clip-path: polygon(0 60%, 100% 60%, 100% 70%, 0 70%); }
            30% { clip-path: polygon(0 80%, 100% 80%, 100% 90%, 0 90%); }
            100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <header class="header">
        <a href="/">
            <img src="logob.svg" alt="Meridian Trust" style="height: 40px;">
        </a>
    </header>

    <div class="content">
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
        <a href="/" class="btn">RETURN TO HOME</a>
    </div>
</body>
</html>
